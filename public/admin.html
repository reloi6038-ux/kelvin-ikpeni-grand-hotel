<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | The Kelvin Ikpeni Grand Hotel</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-body">

  <!-- LOGIN -->
  <div id="loginScreen" class="admin-login-screen">
    <div class="admin-login-bg" style="background-image:url('https://images.unsplash.com/photo-1566073771259-6a8506099945?w=1920&q=80')"></div>
    <div class="admin-login-overlay"></div>

    <div class="admin-login-card">
      <div class="admin-login-brand">
        <span class="brand-mark">The <span style="color:var(--gold-500)">Kelvin Ikpeni</span> Grand</span>
        <span class="brand-tag">Administrator Portal</span>
      </div>

      <div id="loginAlert" role="status" aria-live="polite"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="aEmail">Email Address</label>
          <input id="aEmail" type="email" name="email" class="form-control" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="aPassword">Password</label>
          <div class="password-field">
            <input id="aPassword" type="password" name="password" class="form-control" required autocomplete="current-password" />
            <button type="button" class="password-toggle" aria-label="Show password">👁</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <p class="admin-login-footer">
        Protected area. Unauthorised access is prohibited.
      </p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="admin-dashboard hidden">

    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar-brand">
        <span class="brand-mark">The <span style="color:var(--gold-500)">KIG</span></span>
        <span class="brand-tag">Admin</span>
      </div>

      <nav class="admin-nav" aria-label="Admin navigation">
        <button class="admin-nav-item active" data-tab="overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
          <span>Overview</span>
        </button>
        <button class="admin-nav-item" data-tab="bookings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <span>Bookings</span>
          <em id="badge-bookings" class="badge-count hidden">0</em>
        </button>
        <button class="admin-nav-item" data-tab="rooms">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6M3 18h18M6 10V6h12v4"/></svg>
          <span>Rooms</span>
        </button>
        <button class="admin-nav-item" data-tab="offers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 12V7a2 2 0 0 0-2-2h-5L4 14a2 2 0 0 0 0 3l4 4a2 2 0 0 0 3 0z"/><circle cx="15" cy="8" r="1.5"/></svg>
          <span>Offers</span>
        </button>
        <button class="admin-nav-item" data-tab="messages">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Messages</span>
          <em id="badge-messages" class="badge-count hidden">0</em>
        </button>
        <button class="admin-nav-item" data-tab="reviews">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2l3 6 6 1-4.5 4.5 1 6.5L12 17l-5.5 3 1-6.5L3 9l6-1z"/></svg>
          <span>Reviews</span>
          <em id="badge-reviews" class="badge-count hidden">0</em>
        </button>
        <button class="admin-nav-item" data-tab="spa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3c-2 3-4 5-4 8a4 4 0 0 0 8 0c0-3-2-5-4-8z"/><path d="M6 21h12"/></svg>
          <span>Spa Bookings</span>
        </button>
        <button class="admin-nav-item" data-tab="subscribers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          <span>Subscribers</span>
        </button>
        <button class="admin-nav-item" data-tab="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span>Site Settings</span>
        </button>
      </nav>

      <div class="admin-sidebar-footer">
        <div class="admin-user">
          <div class="admin-user-avatar" id="adminAvatar">A</div>
          <div>
            <div class="admin-user-name" id="adminName">Admin</div>
            <div class="admin-user-role" id="adminRole">Administrator</div>
          </div>
        </div>
        <button id="logoutBtn" class="admin-logout-btn">Sign Out</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="admin-main">
      <header class="admin-topbar">
        <button class="admin-menu-toggle" id="adminMenuToggle" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <h1 class="admin-page-title" id="pageTitle">Overview</h1>
        <div class="admin-topbar-actions">
          <a href="/" target="_blank" class="admin-topbar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14L21 3"/></svg>
            View Site
          </a>
        </div>
      </header>

      <div class="admin-content" id="adminContent">
        <div class="spinner"></div>
      </div>
    </main>
  </div>

  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
